  <h1 class="article-title">Project TimeSeed | 游戏企划日志 0.1</h1>
  <p class="article-meta">2026-09-16</p>

  <div class="article">
    <p>TimeSeed 的第一份公开日志。游戏还没开始做，先把坑占上。</p>

    <h2>核心理念</h2>
    <p>玩家在一个即将被算法彻底均质化的数字废墟中，寻找残存的碳基“方差”（个人艺术、痛苦、狂喜）。</p>

    <h2>开发路线</h2>
    <p>先使用 Claude Code / DeepSeek 生成文本叙事与逻辑框架，再用 Godot 引擎搭建原型。</p>

    <h2>核心机制</h2>
    <p>摒弃传统的刷怪升级，玩家需要通过“甄别真诚与算法伪装”来推进剧情。</p>

    <h2>当前进度</h2>
    <p>企划确立，等待面包（求职）到位后正式开工。</p>
