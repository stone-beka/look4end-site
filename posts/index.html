             改 <title>、og 那几行、大标题，正文写进 <div class="article"> 里。

    第 2 步：回到本文件，把上面那行 placeholder 删掉，
             然后把下面这段的注释符号去掉，改成这一篇的标题和日期。

    <ul class="list">
      <li>
        <a href="001.html">
          <span class="name">标题写这里</span>
          <span class="date">2026-09-16</span>
        </a>
      </li>
    </ul>
